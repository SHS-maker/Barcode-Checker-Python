name: Python-Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Vergleich, Zustände und Einstellungen prüfen
        run: python -m unittest discover -s tests -v
      - name: Alle Python-Dateien auf Syntax prüfen
        run: python -m compileall -q main.py barcode_checker tests
